spring:
  application:
    name: quake-scope
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quake_scope}
    username: ${DATABASE_USERNAME:quake_scope}
    password: ${DATABASE_PASSWORD:quake_scope}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: quake-scope
    description: Earthquake data ingestion and analytics API

quakescope:
  usgs:
    base-url: https://earthquake.usgs.gov
